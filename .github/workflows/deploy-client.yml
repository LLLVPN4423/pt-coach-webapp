name: Deploy Blazor Client to Static Host

on:
  push:
    branches:
      - main
    paths:
      - 'PT.Client/**'
      - 'PT.Shared/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Publish Blazor App
      run: dotnet publish PT.Client/PT.Client.csproj -c Release -o output

